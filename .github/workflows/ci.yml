name: Release on version bump

# 只在 package.json 版本号变化时运行：
# - 推到 main 且改动包含 package.json 才触发（普通代码改动不触发）
# - 也支持手动触发（不发布，仅构建并上传产物）
# 版本号变化时自动创建 v<version> 标签并发布 Release。

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version against existing tags
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')

          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::package.json 版本号格式不合法: ${VERSION}"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "标签 ${TAG} 已存在：本次只构建，不重复发布"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 ${VERSION}：将创建标签 ${TAG} 并发布"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    # 版本没变化（例如只改了依赖）就不构建；手动触发时总是构建
    if: needs.version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc -b --force

      - name: Build both skins
        run: pnpm run build:both

      - name: Compress build output
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist-transmission && zip -qr "../bitcake-${VERSION}-transmission.zip" .)
          (cd dist-qbittorrent/public && zip -qr "../../bitcake-${VERSION}-qbittorrent.zip" .)
          ls -lh bitcake-*.zip

      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        with:
          name: bitcake-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: bitcake-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - version
      - build
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          name: bitcake-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body: |
            由版本变更自动发布：`package.json` 升级到 `${{ needs.version.outputs.version }}`。

            - commit: `${{ github.sha }}`
            - 触发方式: `${{ github.event_name }}`

            ## 📦 产物
            - `bitcake-${{ needs.version.outputs.version }}-transmission.zip`
            - `bitcake-${{ needs.version.outputs.version }}-qbittorrent.zip`
          files: |
            release-assets/bitcake-${{ needs.version.outputs.version }}-transmission.zip
            release-assets/bitcake-${{ needs.version.outputs.version }}-qbittorrent.zip
