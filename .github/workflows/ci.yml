name: Auto tag

# 只负责"版本变化 → 打 tag"。
# 构建、Release 资产、Docker 镜像全部交给 snapshot.yml（Tag Release），
# 这里不构建、不发 Release，避免两套发布逻辑。

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')

          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::package.json 版本号格式不合法: ${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package.json 版本: ${VERSION}"

      - name: Create and push tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          # 必须用 PAT（或 App token）：GITHUB_TOKEN 推送的 tag 不会触发 snapshot.yml
          PUSH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "标签 ${TAG} 已存在，跳过" 
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${VERSION}"
          echo "已创建标签 ${TAG}"

          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::warning::未配置 RELEASE_PAT：改用 GITHUB_TOKEN 推送，snapshot.yml 不会自动触发（GitHub 会抑制由 GITHUB_TOKEN 产生的事件）"
          fi

          git push "https://x-access-token:${PUSH_TOKEN:-${GITHUB_TOKEN}}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          echo "已推送标签 ${TAG}，snapshot.yml 将开始构建与发布"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### 自动打标"
            echo ""
            echo "- 版本: \`${VERSION}\`"
            echo "- 标签: \`${TAG}\`"
            echo "- 后续发布由 \`snapshot.yml\` 负责（构建两种皮肤 + Release + ghcr 镜像）"
          } >> "$GITHUB_STEP_SUMMARY"
