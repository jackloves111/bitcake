name: Tag Release

permissions:
  contents: write
  packages: write

on:
  # 推送任意标签自动发布（标签名去掉前缀 v 必须等于 package.json 版本）
  push:
    tags:
      - '*'
  # 手动触发：Actions → Tag Release → Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v1.1.3；留空则自动使用 v + package.json 版本'
        required: false
        type: string
      push_docker:
        description: '是否构建并推送 ghcr.io 多架构镜像'
        required: false
        type: boolean
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release-version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW_TAG="${INPUT_TAG}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          # 去掉空白，空值回退到 v + package.json 版本
          RAW_TAG=$(printf '%s' "${RAW_TAG}" | tr -d '[:space:]')
          if [ -z "${RAW_TAG}" ]; then
            TAG="v${PACKAGE_VERSION}"
          else
            TAG="${RAW_TAG}"
          fi

          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::非法标签名: ${TAG}"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::标签版本 (${TAG_VERSION}) 与 package.json (${PACKAGE_VERSION}) 不一致"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "解析出的发布标签: ${TAG}（版本 ${TAG_VERSION}）"

      - name: Create tag for manual run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::标签 ${TAG} 已存在且指向 ${TAG_SHA}，与当前提交 ${GITHUB_SHA} 不一致；请改用新版本号或直接推送该标签"
              exit 1
            fi
            echo "标签 ${TAG} 已存在且指向当前提交，直接复用"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "已创建并推送标签 ${TAG}"
          fi

      - name: Build Transmission version
        run: pnpm run build:transmission

      - name: Build qBittorrent version
        run: pnpm run build:qbittorrent

      - name: Compress release files
        shell: bash
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist-transmission && zip -r "../bitcake-${VERSION}-transmission.zip" .)
          (cd dist-qbittorrent/public && zip -r "../../bitcake-${VERSION}-qbittorrent.zip" .)

      - name: Compose release notes
        shell: bash
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          TAG: ${{ steps.release-version.outputs.tag }}
          WITH_DOCKER: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          {
            echo "Automated build from tag \`${TAG}\` and commit \`${GITHUB_SHA}\`."
            echo
            echo "## 📦 Build Artifacts"
            echo "- \`bitcake-${VERSION}-transmission.zip\` - Transmission 客户端版本"
            echo "- \`bitcake-${VERSION}-qbittorrent.zip\` - qBittorrent 客户端版本"
            if [ "${WITH_DOCKER}" = "true" ]; then
              echo
              echo "## 🐳 Docker Image"
              echo '```bash'
              echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/bitcake:${VERSION}"
              echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/bitcake:latest"
              echo '```'
            else
              echo
              echo "> 本次运行未构建 Docker 镜像。"
            fi
            echo
            echo "> 触发方式：\`${GITHUB_EVENT_NAME}\`${GITHUB_ACTOR:+ by @${GITHUB_ACTOR}}"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: ${{ steps.release-version.outputs.version }}
          body_path: release-notes.md
          prerelease: false
          files: |
            bitcake-${{ steps.release-version.outputs.version }}-transmission.zip
            bitcake-${{ steps.release-version.outputs.version }}-qbittorrent.zip

      # Docker 镜像构建和推送（手动触发时可勾选跳过）
      - name: Set up QEMU
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitcake
          tags: |
            type=raw,value=${{ steps.release-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_docker == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
