name: Snapshot Release

# 手动触发：版本号自动取自 package.json → 构建两种皮肤 → 打标签 v<version> → 发布 Release（附两个 zip）
# 构建流程复用历史版本（commit c46dc80），发布步骤改用 gh CLI + 重试：
# softprops/action-gh-release 在当前仓库会返回 403（Resource not accessible by integration）与偶发 500。

on:
  workflow_dispatch:    # 手动触发：版本号取自 package.json

permissions:
  contents: write  # 必需权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Extract package version
        id: package-version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get short commit SHA
        id: commit-id
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build Transmission version
        run: pnpm run build:transmission

      - name: Build qBittorrent version
        run: pnpm run build:qbittorrent

      - name: Compress files to ZIP
        run: |
          # 压缩 Transmission 版本
          cd dist-transmission
          zip -r ../bitcake-${{ steps.package-version.outputs.version }}-transmission.zip .
          cd ..

          # 压缩 qBittorrent 版本 (在 public 子目录中)
          cd dist-qbittorrent/public
          zip -r ../../bitcake-${{ steps.package-version.outputs.version }}-qbittorrent.zip .
          cd ../..

          # 输出文件路径供后续步骤使用
          echo "TRANSMISSION_ZIP=$(pwd)/bitcake-${{ steps.package-version.outputs.version }}-transmission.zip" >> $GITHUB_ENV
          echo "QBITTORRENT_ZIP=$(pwd)/bitcake-${{ steps.package-version.outputs.version }}-qbittorrent.zip" >> $GITHUB_ENV

      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        with:
          name: bitcake-${{ steps.package-version.outputs.version }}
          path: bitcake-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create Snapshot Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-version.outputs.version }}
          TAG: v${{ steps.package-version.outputs.version }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "::warning::第 ${attempt} 次尝试失败，5 秒后重试: $*"
              sleep 5
            done
            echo "::error::重试 5 次后仍然失败: $*"
            return 1
          }

          {
            echo "手动打包发布：\`${VERSION}\`（版本号自动取自 package.json）。"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 触发人: @${ACTOR}"
            echo
            echo "## 📦 产物"
            echo "- \`bitcake-${VERSION}-transmission.zip\`"
            echo "- \`bitcake-${VERSION}-qbittorrent.zip\`"
          } > release-notes.md

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            retry git tag -a "${TAG}" -m "Release ${VERSION}"
            retry git push origin "refs/tags/${TAG}"
            echo "已创建并推送标签 ${TAG}"
          else
            echo "标签 ${TAG} 已存在，复用"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            retry gh release edit "${TAG}" --title "${VERSION}" --notes-file release-notes.md
          else
            retry gh release create "${TAG}" --title "${VERSION}" --notes-file release-notes.md --target "${SHA}"
          fi

          for file in bitcake-*.zip; do
            retry gh release upload "${TAG}" "${file}" --clobber
          done

          echo "Release ${TAG} 已发布"
