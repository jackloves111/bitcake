name: Manual package

# 手动触发：自动读取 package.json 的版本 → 构建两种皮肤 → 创建（或复用）tag → 发布 Release（附两个 zip）
# 不依赖 snapshot.yml，也不修改它。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '标签名，留空则自动使用 v<package.json 版本>'
        required: false
        type: string
      overwrite:
        description: '同名 Release 已存在时覆盖其中的资产文件'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: manual-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Read version from package.json
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          VERSION=$(node -p 'require("./package.json").version')
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::package.json 版本号格式不合法: ${VERSION}"
            exit 1
          fi

          TAG=$(printf '%s' "${INPUT_TAG}" | tr -d '[:space:]')
          if [ -z "${TAG}" ]; then
            TAG="v${VERSION}"
          fi

          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::非法标签名: ${TAG}"
            exit 1
          fi

          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::标签 ${TAG} 与 package.json 版本 ${VERSION} 不匹配（应形如 v${VERSION}）"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "package.json 版本: ${VERSION}，标签: ${TAG}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Transmission version
        run: pnpm run build:transmission

      - name: Build qBittorrent version
        run: pnpm run build:qbittorrent

      - name: Compress build output
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist-transmission && zip -qr "../bitcake-${VERSION}-transmission.zip" .)
          (cd dist-qbittorrent/public && zip -qr "../../bitcake-${VERSION}-qbittorrent.zip" .)
          ls -lh bitcake-*.zip

      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        with:
          name: bitcake-${{ steps.vars.outputs.version }}
          path: bitcake-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create tag if missing
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "::warning::标签 ${TAG} 已存在且指向 ${TAG_SHA}，与本次构建的 ${HEAD_SHA} 不同；Release 资产将挂在该标签上"
            else
              echo "标签 ${TAG} 已存在且指向当前提交，直接复用"
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "已创建并推送标签 ${TAG}"

      # 用 gh CLI + 重试，避免 GitHub 偶发 500 让发布步骤直接失败
      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          OVERWRITE: ${{ github.event.inputs.overwrite }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "::warning::第 ${attempt} 次尝试失败，5 秒后重试: $*"
              sleep 5
            done
            echo "::error::重试 5 次后仍然失败: $*"
            return 1
          }

          {
            echo "手动打包发布：\`${VERSION}\`（版本号自动取自 package.json）。"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 触发人: @${ACTOR}"
            echo
            echo "## 📦 产物"
            echo "- \`bitcake-${VERSION}-transmission.zip\`"
            echo "- \`bitcake-${VERSION}-qbittorrent.zip\`"
          } > release-notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，更新说明"
            retry gh release edit "${TAG}" --title "${VERSION}" --notes-file release-notes.md
          else
            echo "创建 Release ${TAG}"
            retry gh release create "${TAG}" --title "${VERSION}" --notes-file release-notes.md --target "${SHA}"
          fi

          for file in bitcake-*.zip; do
            if [ "${OVERWRITE}" = "true" ]; then
              retry gh release upload "${TAG}" "${file}" --clobber
            else
              retry gh release upload "${TAG}" "${file}"
            fi
          done

          echo "Release ${TAG} 已发布"
