name: Manual package

# 手动触发：输入版本号 → 构建两种皮肤 → 创建（或复用）tag → 发布 Release（附两个 zip）
# 不依赖 snapshot.yml，也不修改它。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要打包的版本，必须与 package.json 的 version 一致，例如 1.1.3'
        required: true
        type: string
      tag:
        description: '标签名，留空则使用 v<version>'
        required: false
        type: string
      overwrite:
        description: '同名 Release 已存在时覆盖其中的资产文件'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: manual-package-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve and validate version
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          VERSION=$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]')
          if [ -z "${VERSION}" ]; then
            echo "::error::请填写要打包的版本，例如 1.1.3"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::输入版本 ${VERSION} 与 package.json 的 ${PACKAGE_VERSION} 不一致"
            exit 1
          fi

          TAG=$(printf '%s' "${INPUT_TAG}" | tr -d '[:space:]')
          if [ -z "${TAG}" ]; then
            TAG="v${VERSION}"
          fi

          if ! printf '%s' "${TAG}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::非法标签名: ${TAG}"
            exit 1
          fi

          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::标签 ${TAG} 与版本 ${VERSION} 不匹配（应形如 v${VERSION}）"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "将打包 ${VERSION}，标签 ${TAG}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Transmission version
        run: pnpm run build:transmission

      - name: Build qBittorrent version
        run: pnpm run build:qbittorrent

      - name: Compress build output
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist-transmission && zip -qr "../bitcake-${VERSION}-transmission.zip" .)
          (cd dist-qbittorrent/public && zip -qr "../../bitcake-${VERSION}-qbittorrent.zip" .)
          ls -lh bitcake-*.zip

      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        with:
          name: bitcake-${{ steps.vars.outputs.version }}
          path: bitcake-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create tag if missing
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          HEAD_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "::warning::标签 ${TAG} 已存在且指向 ${TAG_SHA}，与本次构建的 ${HEAD_SHA} 不同；Release 资产将挂在该标签上"
            else
              echo "标签 ${TAG} 已存在且指向当前提交，直接复用"
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "已创建并推送标签 ${TAG}"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          overwrite_files: ${{ github.event.inputs.overwrite }}
          body: |
            手动打包发布：`${{ steps.vars.outputs.version }}`。

            - commit: `${{ github.sha }}`
            - 触发人: @${{ github.actor }}

            ## 📦 产物
            - `bitcake-${{ steps.vars.outputs.version }}-transmission.zip`
            - `bitcake-${{ steps.vars.outputs.version }}-qbittorrent.zip`
          files: |
            bitcake-${{ steps.vars.outputs.version }}-transmission.zip
            bitcake-${{ steps.vars.outputs.version }}-qbittorrent.zip
